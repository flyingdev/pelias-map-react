<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Pelias + MapLibre North America</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

    <script src="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.css" type="text/css" />

    <link href="https://unpkg.com/@maplibre/maplibre-gl-directions@0.6.0/dist/maplibre-gl-directions.css" rel="stylesheet" />
    <script src="https://unpkg.com/@maplibre/maplibre-gl-directions@0.6.0/dist/maplibre-gl-directions.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        /* Optional: Style adjustments for the geocoder position */
        .maplibregl-ctrl-geocoder {
            min-width: 300px;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // 1. Initialize the Map
    var map = new maplibregl.Map({
        container: 'map',
        // Use a free public style (OpenStreetMap raster tiles) since you don't have a tile server yet.
        style: 'http://localhost:8080/styles/basic-preview/style.json', 
        center: [-77.8600, 40.7934], // Centered on State College/Boalsburg

        zoom: 6
    });

    // 2. Add the Geocoder (Connected to YOUR Pelias)
    var geocoder_api = {
        forwardGeocode: async (config) => {
            const features = [];
            try {
                // Pointing to your local Docker container
                let request = 'http://localhost:4000/v1/search?text=' + config.query;
                
                const response = await fetch(request);
                const geojson = await response.json();
                
                // MapLibre expects a slightly different format, but Pelias GeoJSON is standard enough
                // We just return the features array directly
                return {
                    features: geojson.features
                };
            } catch (e) {
                console.error(`Failed to forwardGeocode with error: ${e}`);
            }
        }
    };

    map.addControl(
        new MaplibreGeocoder(geocoder_api, {
            maplibregl: maplibregl,
            marker: true,
            showResultMarkers: true,
            placeholder: 'Search North America (Localhost)...'
        }),
        'top-left'
    );

    // 3. Add Directions (Routing)
    // CRITICAL: This requires a routing backend (Valhalla/OSRM).
    // Pelias does NOT provide this API.
    
    // Uncomment the lines below if/when you have a router running.
    map.on('load', async () => {
      // 1. Define the Valhalla Route Request
      const requestBody = {
          locations: [
              { lat: 40.7128, lon: -74.0060 }, // New York
              { lat: 39.9526, lon: -75.1652 }  // Philadelphia
          ],
          costing: "auto",
          units: "km"
      };

      // 2. Fetch from your Local Tunnel (Port 8002)
      const response = await fetch('http://localhost:8002/route', {
          method: 'POST',
          body: JSON.stringify(requestBody)
      });
      
      const data = await response.json();
      
      // 3. Decode the "Shape" (Polyline) from Valhalla
      // Valhalla returns a compressed string to save bandwidth. We must decode it.
      const coordinates = decodePolyline(data.trip.legs[0].shape, 6);

      // 4. Add the Line to the Map
      map.addSource('route', {
          'type': 'geojson',
          'data': {
              'type': 'Feature',
              'properties': {},
              'geometry': {
                  'type': 'LineString',
                  'coordinates': coordinates
              }
          }
      });

      map.addLayer({
          'id': 'route',
          'type': 'line',
          'source': 'route',
          'layout': {
              'line-join': 'round',
              'line-cap': 'round'
          },
          'paint': {
              'line-color': '#3b9ddd',
              'line-width': 8
          }
      });
  });

  // Helper: Valhalla uses 6-digit precision polylines
  function decodePolyline(str, precision) {
      var index = 0, lat = 0, lng = 0, coordinates = [], shift = 0, result = 0, byte = null, latitude_change, longitude_change, factor = Math.pow(10, precision || 6);
      while (index < str.length) {
          byte = null; shift = 0; result = 0;
          do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
          latitude_change = ((result & 1) ? ~(result >> 1) : (result >> 1));
          shift = result = 0;
          do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
          longitude_change = ((result & 1) ? ~(result >> 1) : (result >> 1));
          lat += latitude_change; lng += longitude_change;
          coordinates.push([lng / factor, lat / factor]);
      }
      return coordinates;
  }
    // Add standard navigation controls (Zoom in/out)
    map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

</script>

</body>
</html>
